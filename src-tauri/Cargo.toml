[package]
name = "aether-gui"
version = "2.2.0"
description = "Aethon - an independent Windows desktop frontend for Aether"
authors = ["hamvex"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "aether_gui_lib"
# rlib only. `main.rs` links this crate statically and nothing else consumes it:
# there is no Tauri mobile target, no `mobile_entry_point`, and no external loader.
# The `cdylib` and `staticlib` outputs were unused, and the `aether_gui_lib.dll`
# that `cdylib` produced was collected into every MSI by the WiX bundler as a dead
# 457 KB payload. Do not add them back without a consumer.
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
webpki-roots = "1"
regex = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

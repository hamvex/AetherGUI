name: Windows and Android release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        shell: pwsh
        run: sdkmanager "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci
      - name: Fetch and verify Aether core
        run: npm run fetch:core
      - name: Fetch and verify routing engine
        run: npm run fetch:routing
      - name: Test frontend
        run: npm test
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build application and installers
        run: npm run build

      - name: Fetch verified Android native assets
        run: npm run fetch:android

      - name: Prepare Android signing key
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force android/.android-signing | Out-Null
          [IO.File]::WriteAllBytes("android/.android-signing/firstham-aethergui.jks", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

      - name: Build signed Android APKs
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PATH: .android-signing/firstham-aethergui.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          Set-Location android
          ./gradlew.bat assembleRelease lintRelease

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release/
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Copy-Item src-tauri/target/release/aether-gui.exe "portable/Firstham AetherGui.exe"
          Copy-Item src-tauri/binaries/aether-x86_64-pc-windows-msvc.exe portable/aether.exe
          Copy-Item src-tauri/binaries/sing-box-x86_64-pc-windows-msvc.exe portable/sing-box.exe
          Copy-Item LICENSE,NOTICE.md,TRADEMARK.md,third-party/sing-box-LICENSE.txt portable/
          Compress-Archive -Path portable/* -DestinationPath "release/Firstham_AetherGui_${version}_x64-portable.zip"
          Copy-Item android/app/build/outputs/apk/release/app-universal-release.apk "release/Firstham_AetherGui_${version}_android-universal.apk"
          Copy-Item android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "release/Firstham_AetherGui_${version}_android-arm64.apk"
          Copy-Item android/app/build/outputs/apk/release/app-x86_64-release.apk "release/Firstham_AetherGui_${version}_android-x86_64.apk"
          Get-ChildItem release -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Add-Content release/SHA256SUMS.txt
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Firstham-AetherGui-Windows-Android
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          body: |
            Firstham AetherGui - independent Windows and Android clients for Aether.

            Version 1.8.0 stabilizes the Android VPN runtime with a source-built HEV 2.16.0 JNI bridge, fail-closed recovery, diagnostics, and a redesigned white-and-blue Material 3 interface.
            The bundled Aether 1.5.0 core and sing-box 1.13.14 TUN engine are fetched from official releases and SHA-256 verified during the build.
            Windows 10/11 x64 and Android 8.0+ are supported. Windows binaries are unsigned and may trigger a SmartScreen warning; Android APKs are release-signed.
